services:
  # ==============================
  # Backend - Node/Express
  # ==============================
  - type: web
    name: gen-ai-resume-backend
    runtime: node
    rootDir: GEN-Ai-backend
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: npm start
    plan: free
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      - key: MONGO_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: GOOGLE_GENAI_API_KEY
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/GEN-Ai-backend/.cache/puppeteer


  # ==============================
  # Frontend - React/Vite
  # ==============================
  - type: web
    name: gen-ai-resume-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html